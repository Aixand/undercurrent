[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aixand-undercurrent-sdk"
version = "0.1.0b0"
description = "Async Python client for the local Undercurrent runtime"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
undercurrent = ["py.typed"]
