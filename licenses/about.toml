# Supplement the exact source license files with notices in source headers.
# cargo-about 0.9.2; the collector separately checks graph coverage.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
