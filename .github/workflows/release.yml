name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Crates.io publication is incremental. Finish a release instead of cancelling it.
concurrency:
  group: undercurrent-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, source commit, and publication graph
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/automation.py check

  documentation:
    needs: validate
    uses: ./.github/workflows/docs.yml
  repository-policy:
    needs: validate
    uses: ./.github/workflows/repository-files.yml
  secrets:
    needs: validate
    uses: ./.github/workflows/secret-scan.yml
  advisories:
    needs: validate
    uses: ./.github/workflows/dependency-advisories.yml
  licenses:
    needs: validate
    uses: ./.github/workflows/licenses.yml
  product:
    needs: validate
    uses: ./.github/workflows/product-installer.yml
  python:
    needs: validate
    uses: ./.github/workflows/python-sdk.yml
  native:
    needs: validate
    uses: ./.github/workflows/platform-contracts.yml

  publish:
    name: Publish qualified release
    needs: [documentation, repository-policy, secrets, advisories, licenses, product, native, python]
    if: github.repository == 'Aixand/undercurrent'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: dist/assets
          merge-multiple: true
      - name: Check credentials are configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 -c 'import os; assert os.environ.get("CARGO_REGISTRY_TOKEN"), "Configure the CARGO_REGISTRY_TOKEN Actions secret"'
      - name: Validate complete downloads and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/automation.py collect
      - name: Select the qualified Python SDK wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/automation.py prepare-python
      - name: Prepare draft GitHub Release and upload downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/automation.py draft
      - name: Publish the SDK dependency graph to crates.io
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release/automation.py publish-crates
      - name: Publish Python SDK to PyPI
        run: uv publish --trusted-publishing always dist/pypi/*.whl
      - name: Publish GitHub Release after crates.io and PyPI succeed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/automation.py publish-release

  python-only-checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Aixand/undercurrent'
    uses: ./.github/workflows/python-sdk.yml

  publish-python-only:
    name: Publish only the Python SDK
    needs: python-only-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-sdk-wheel
          path: dist/pypi
      - name: Verify publication inputs
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 scripts/release/automation.py python-check --tag "$tag"
          python3 scripts/release/third_party_licenses.py check
          python3 scripts/checks/check-repository-files.py
          python3 scripts/checks/check-docs.py --root .
      - name: Publish Python SDK to PyPI
        run: uv publish --trusted-publishing always dist/pypi/*.whl
