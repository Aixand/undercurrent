name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Crates.io publication is incremental. Finish a release instead of cancelling it.
concurrency:
  group: undercurrent-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, source commit, and publication graph
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/automation.py check

  documentation:
    needs: validate
    uses: ./.github/workflows/docs.yml
  repository-policy:
    needs: validate
    uses: ./.github/workflows/repository-files.yml
  secrets:
    needs: validate
    uses: ./.github/workflows/secret-scan.yml
  advisories:
    needs: validate
    uses: ./.github/workflows/dependency-advisories.yml
  licenses:
    needs: validate
    uses: ./.github/workflows/licenses.yml
  product:
    needs: validate
    uses: ./.github/workflows/product-installer.yml
  native:
    needs: validate
    uses: ./.github/workflows/platform-contracts.yml

  publish:
    name: Publish qualified release
    needs: [documentation, repository-policy, secrets, advisories, licenses, product, native]
    if: github.repository == 'Aixand/undercurrent'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: dist/assets
          merge-multiple: true
      - name: Check credentials are configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 -c 'import os; assert os.environ.get("CARGO_REGISTRY_TOKEN"), "Configure the CARGO_REGISTRY_TOKEN Actions secret"'
      - name: Validate complete downloads and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/automation.py collect
      - name: Prepare draft GitHub Release and upload downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/automation.py draft
      - name: Publish the SDK dependency graph to crates.io
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release/automation.py publish-crates
      - name: Publish GitHub Release after crates.io succeeds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/automation.py publish-release
