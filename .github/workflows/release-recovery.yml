name: Recover qualified beta release

on:
  push:
    branches: [release/recovery-v0.1.0-beta]

permissions:
  contents: write
  actions: read

concurrency:
  group: undercurrent-release
  cancel-in-progress: false

jobs:
  publish:
    name: Resume immutable qualified release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    env:
      RELEASE_TAG: v0.1.0-beta
      UNDERCURRENT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
    steps:
      - name: Check out repaired publication tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: recovery-tools
          persist-credentials: false
      - name: Check out the immutable qualified source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: v0.1.0-beta
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Test the repaired recovery and integrity checks
        run: python3 -B recovery-tools/tests/tooling/checks/release_automation_test.py
      - name: Verify original qualification and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          expected = "66e971f5ef725f409cb8cdbc2f976a5b44205cd6"
          run_id = "42787422374"
          repo = os.environ["GITHUB_REPOSITORY"]
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repo}/actions/runs/{run_id}"
          ], text=True))
          assert run["head_sha"] == expected and run["event"] == "push", run
          assert run["head_repository"]["full_name"] == repo, run
          jobs = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100"
          ], text=True))["jobs"]
          qualified = [job for job in jobs if job["name"] != "Publish qualified release"]
          assert len(qualified) == 15, [(job["name"], job["conclusion"]) for job in jobs]
          assert all(job["conclusion"] == "success" for job in qualified), qualified
          source = os.environ["UNDERCURRENT_RELEASE_SOURCE_ROOT"]
          actual = subprocess.check_output(["git", "-C", source, "rev-parse", "HEAD"], text=True).strip()
          assert actual == expected, actual
          print("All 15 original qualification jobs passed; source identity is unchanged.")
          PY
          python3 recovery-tools/scripts/release/automation.py check
      - name: Install the qualified Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Download the original qualified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 42787422374
          github-token: ${{ github.token }}
          pattern: release-assets-*
          path: release-source/dist/assets
          merge-multiple: true
      - name: Verify downloads and regenerate checksums
        run: python3 recovery-tools/scripts/release/automation.py collect
      - name: Verify and refresh the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 recovery-tools/scripts/release/automation.py draft
      - name: Verify existing crates and publish only missing versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 recovery-tools/scripts/release/automation.py publish-crates
      - name: Publish the GitHub Release after crates.io succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 recovery-tools/scripts/release/automation.py publish-release
