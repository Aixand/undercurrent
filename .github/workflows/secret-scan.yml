name: Secret scanning

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          scan_dir="$RUNNER_TEMP/open-source-secret-scan"
          mkdir -p "$scan_dir"
          archive="$scan_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$scan_dir" gitleaks
      - name: Scan fetched Git history
        shell: bash
        run: |
          scan_dir="$RUNNER_TEMP/open-source-secret-scan"
          # Keep rules and ignore files outside contributor-controlled source.
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          # The fresh public history has no finding exceptions.
          : > "$scan_dir/.gitleaksignore"
          # Gitleaks also auto-loads the checkout's ignore file. Remove only the
          # runner copy; committed contents remain in the history being scanned.
          rm -f -- .gitleaksignore
          "$scan_dir/gitleaks" git . \
            --log-opts='--all --full-history' \
            --config "$scan_dir/config.toml" \
            --gitleaks-ignore-path "$scan_dir/.gitleaksignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --verbose
