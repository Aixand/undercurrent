name: Dependency advisories

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned audit tool
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit the locked dependency graph
        run: |
          cargo +1.95.0 audit --deny unsound
          cargo +1.95.0 audit --file tests/architecture/consumer/Cargo.lock --deny unsound
