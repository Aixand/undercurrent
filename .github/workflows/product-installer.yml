name: Product installer
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    name: Product installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_LINK_MODE: copy
      CARGO_BUILD_JOBS: '6'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: '3.12.14'
          activate-environment: true
      - run: python scripts/dev/cli.py develop
      - name: Windows developer entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev.ps1 doctor
      - name: Native Windows command launcher
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install Linux shell fixtures
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: python scripts/dev/cli.py check
      - run: python scripts/dev/cli.py test
      - name: Linux group and shell contracts
        if: runner.os == 'Linux'
        run: |
          python tests/conformance/groups_test.py
          python tests/e2e/run.py --test exec-environment --test platform-detection --bin-dir target/debug
      - name: Reclaim Linux development build space before packaging
        if: runner.os == 'Linux'
        run: cargo clean --profile dev
      - run: python scripts/dev/cli.py package --output dist/release
      - run: python scripts/dev/cli.py verify --artifact dist/release --install --report dist/verification.json
      - run: python scripts/prepare_product_runtime.py --bootstrap-output dist/bootstrap
      - run: python scripts/qualify_product_installation.py dist/release --exercise-upgrade --bootstrap dist/bootstrap --report dist/lifecycle.json
      - run: python scripts/dev/cli.py package --component sdk --output dist/sdk
      - run: python scripts/dev/cli.py verify --artifact dist/sdk --install --report dist/sdk-verification.json
      - run: python scripts/dev/cli.py export-release --artifact dist/release --report dist/verification.json --output dist/handoff
      - name: Verify crates.io packages on the native platform
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release/automation.py crates-check
      - name: Prepare versioned release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release/automation.py archive
      - name: Upload versioned release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          path: dist/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: undercurrent-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          path: |
            dist/handoff/
            dist/bootstrap/
            dist/lifecycle.json
            dist/sdk/
          if-no-files-found: error
