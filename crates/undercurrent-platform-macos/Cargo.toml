[package]
name = "undercurrent-platform-macos"
description = "Native macOS process observation for Undercurrent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[build-dependencies]
cc = "1.4.3"

# This OS adapter is the narrow FFI boundary. Runtime and all other product
# crates retain workspace unsafe_code=forbid. Each unsafe function below has
# its own explicit allowance and safety argument; there is no module allowance.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
