[package]
name = "undercurrent-mcp"
description = "Local stdio Model Context Protocol server for Undercurrent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "uc-mcp"
path = "src/main.rs"

[dependencies]
undercurrent-config = { path = "../undercurrent-config" }
undercurrent-sdk = { package = "aixand-undercurrent", path = "../undercurrent-sdk" }
undercurrent-protocol = { package = "aixand-undercurrent-protocol", path = "../undercurrent-protocol" }
clap.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
