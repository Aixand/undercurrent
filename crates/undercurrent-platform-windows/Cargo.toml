[package]
name = "aixand-undercurrent-platform-windows"
description = "Native Windows process, terminal, and IPC primitives for Undercurrent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "undercurrent_platform_windows"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_SystemInformation"] }
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "sync", "time", "macros", "signal"] }
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Keep unsafe OS calls behind a small, checked adapter, as on macOS.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
