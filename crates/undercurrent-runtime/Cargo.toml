[package]
name = "undercurrent-runtime"
description = "Process supervision and terminal runtime adapters for Undercurrent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
undercurrent-foundation.workspace = true
async-channel.workspace = true
dotenvy.workspace = true
getrandom.workspace = true
portable-pty.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = "1.0.151"
sha2.workspace = true
ureq.workspace = true
vt100.workspace = true
undercurrent-application = { path = "../undercurrent-application" }
undercurrent-domain = { path = "../undercurrent-domain" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["socket", "user", "fs", "event"] }
signal-hook.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
undercurrent-platform-macos = { path = "../undercurrent-platform-macos" }

[target.'cfg(windows)'.dependencies]
undercurrent-platform-windows = { package = "aixand-undercurrent-platform-windows", path = "../undercurrent-platform-windows" }

[dev-dependencies]
tempfile.workspace = true
undercurrent-store-sqlite = { path = "../undercurrent-store-sqlite" }
vt100-reference = { package = "vt100", version = "=0.15.2", registry = "crates-io" }
vte.workspace = true
vte-reference = { package = "vte", version = "=0.11.1", registry = "crates-io" }

[[bench]]
name = "terminal_decoder"
harness = false

[lints]
workspace = true
