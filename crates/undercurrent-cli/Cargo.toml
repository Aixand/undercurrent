[package]
name = "undercurrent-cli"
description = "Command-line client and terminal interface for Undercurrent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "uc"
path = "src/main.rs"

[dependencies]
zip = { version = "9.0.0", default-features = false }
undercurrent-diagnostics = { path = "../undercurrent-diagnostics" }
rustix.workspace = true
undercurrent-config = { path = "../undercurrent-config" }
anstream = "1.0.0"
base64 = "0.22.1"
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["dir", "fs", "user"] }
serde.workspace = true
serde_json = "1.0.151"
signal-hook.workspace = true
toml = "0.9.12"
vt100.workspace = true
vte.workspace = true
sha2.workspace = true
uuid.workspace = true
unicode-width = "0.2.2"
undercurrent-protocol = { package = "aixand-undercurrent-protocol", path = "../undercurrent-protocol" }
undercurrent-sdk = { package = "aixand-undercurrent", path = "../undercurrent-sdk" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
undercurrent-platform-windows = { package = "aixand-undercurrent-platform-windows", path = "../undercurrent-platform-windows" }
