[workspace]
members = ["crates/*"]
exclude = [
    "tests/architecture/consumer",
    "vendor/vt100",
    "vendor/vte",
    "vendor/portable-pty",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Aixand/undercurrent"

[workspace.dependencies]
undercurrent-foundation = { package = "aixand-undercurrent-foundation", path = "crates/undercurrent-foundation", version = "=0.1.0-beta" }
async-channel = "2.5.0"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
crossterm = "0.28.1"
dotenvy = "0.15.7"
getrandom = "0.4.3"
jsonschema = { version = "0.49.9", default-features = false }
libc = "0.2.180"
log = { version = "0.4.33", features = ["release_max_level_info"] }
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
portable-pty = { version = "=0.9.0", path = "vendor/portable-pty" }
proptest = "1.11.0"
regex = "1.12.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
signal-hook = "0.4.4"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.22.0", features = ["serde", "v7"] }
vt100 = { version = "=0.15.2", path = "vendor/vt100" }
vte = { version = "=0.11.1", path = "vendor/vte" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.metadata.undercurrent]
placement = "external_only"

[profile.dev]
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
